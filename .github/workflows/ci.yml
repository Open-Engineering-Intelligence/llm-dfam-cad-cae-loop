name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .[dev]

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest -q

      - name: Package import test
        run: python -c "import open_engineering_intelligence; print(open_engineering_intelligence.__version__)"
